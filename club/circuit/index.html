<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142a2c"><title>港湾赛道俱乐部 · Harbor Circuit</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head><body>
<canvas id="view" tabindex="0" aria-label="港湾赛道驾驶画面"></canvas><div class="shade"></div>
<div id="loading" class="overlay"><div class="load-card"><span class="eyebrow">HARBOR CIRCUIT / 01</span><h1>下一圈，<br>更接近极限。</h1><p id="load-text">正在准备赛道</p><progress id="progress" max="1" value="0"></progress><p id="error" role="alert"></p><button id="retry-load" hidden>重新加载</button></div></div>
<main id="garage" hidden>
 <header><a href="../" class="brand">HARBOR<span>CIRCUIT</span></a><nav><span id="proficiency"></span><button data-action="records">圈速记录</button><button data-action="help">驾驶指南</button><a href="../">返回俱乐部 ↗</a></nav></header>
 <section class="garage-panel"><p class="eyebrow">DRIVE. LEARN. RACE.</p><h1>让每一圈，<br>都有进步。</h1><p class="intro">寻找刹车点，感受轮胎的极限。<br>从你的第一圈，到港湾冠军。</p>
 <div class="car-info"><span id="car-edition"></span><h2 id="car-name"></h2><p id="car-description"></p><div id="car-stats"></div></div>
 <div class="select-grid"><label>路线<select id="track"><option value="harbor">港湾短环</option><option value="coast">海岸技术线</option></select></label><label>赛事<select id="event"><option value="practice">自由练圈 / 计时</option><option value="test">试车场 / 加速制动</option><option value="race">同车短赛 · 约 6–8 分钟</option><option value="championship">三站锦标赛</option></select></label></div>
 <p id="event-description" class="muted"></p><details><summary>车辆调校与辅助</summary><div class="select-grid"><label>调校<select id="setup"><option value="balanced">均衡</option><option value="stable">稳定 · 制动偏前</option><option value="agile">灵活 · 车尾更活跃</option></select></label><label>AI 难度<select id="difficulty"><option value="club">俱乐部</option><option value="sport">竞技</option><option value="expert">挑战</option></select></label><label>ABS<select id="abs"><option value="true">开启</option><option value="false">关闭</option></select></label><label>牵引控制<select id="tc"><option value="2">标准</option><option value="1">运动</option><option value="0">关闭</option></select></label><label>电车回收<select id="regen"><option value="1">标准</option><option value="2">强</option><option value="0">关闭</option></select></label><label>画面<select id="quality"><option value="auto">高精度车辆</option><option value="low">轻量车辆</option></select></label><label>声音<input id="volume" type="range" min="0" max="1" step=".05"></label><label>车身颜色<select id="paint"><option value="0">原厂风格</option><option value="1">象牙白 · 60 熟练度</option><option value="2">落日红 · 150 熟练度</option></select></label></div><p class="muted">辅助和调校分别记录成绩。调校没有数值升级；所有 AI 使用相同车型、辅助与抓地规则。</p></details>
 <div class="start-row"><button class="primary" id="start">驶入赛道 <span>↗</span></button><span id="best"></span></div>
 </section>
 <aside class="track-caption"><span id="track-distance"></span><h2 id="track-name"></h2><p id="track-subtitle"></p></aside>
 <div class="car-cards" id="cars" aria-label="选择车辆"></div>
 <footer><span id="controller">WASD / 方向键驾驶 · 支持手柄</span><span id="storage-status">单人驾驶 · 浏览器本地保存</span><a href="CREDITS.html">车型说明与素材鸣谢</a></footer>
</main>
<section id="hud" hidden aria-label="比赛信息"><header><div><span id="race-label" class="eyebrow"></span><h2 id="race-title"></h2></div><nav><button data-action="camera" id="camera">追尾 · C</button><button data-action="pause">暂停 · Esc</button></nav></header><div id="countdown" aria-live="polite"></div><div class="timing"><span id="lap"></span><strong id="lap-time">0:00.000</strong><span id="delta"></span><span id="validity"></span></div><div id="standings"></div><p id="notice" role="status"></p><canvas id="map" width="220" height="220" aria-label="赛道地图"></canvas><div class="instruments"><div class="speed"><b id="speed">0</b><small>km/h</small><span id="gear">1</span></div><div class="rev"><i id="rpm-fill"></i></div><p id="powertrain"></p><div class="pedals"><span>油门 <i id="gas"></i></span><span>制动 <i id="brake"></i></span><b id="assists"></b></div></div><p id="hint"></p><div class="drive-actions"><button data-action="reset">返回赛道 F · +5s</button><button data-action="finish" id="finish-practice">结束练习</button><button data-action="retry-sector" id="retry-sector" hidden>重练上圈薄弱段</button><small>R 重开 · C 视角 · Q+油门倒车 · 空格手刹</small></div></section>
