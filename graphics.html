<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全局光影升级对照 · Harbor Stories</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c21;color:#e5edea;font:15px/1.65 system-ui,-apple-system,sans-serif}main{max-width:1440px;margin:auto;padding:38px 28px}a{color:#efd39a;text-underline-offset:4px}.eyebrow{font-size:11px;letter-spacing:.22em;color:#acbdbb}h1{font-size:clamp(26px,4vw,46px);line-height:1.2;margin:12px 0 14px}p{color:#b8c8c6;max-width:850px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 16px}button{border:1px solid #455959;color:#dbe9e5;background:#1e3238;border-radius:5px;padding:9px 20px;font:inherit;cursor:pointer}button[aria-pressed=true]{color:#111f23;background:#ecd5a6;border-color:#ecd5a6}button:focus-visible,input:focus-visible{outline:3px solid #d8b866;outline-offset:4px}.compare{position:relative;aspect-ratio:8/5;overflow:hidden;border:1px solid #475e61;border-radius:8px;background:#26383e}.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.compare .old{clip-path:inset(0 50% 0 0)}.line{position:absolute;inset:0 auto 0 50%;width:2px;background:#f0d6a4;pointer-events:none}.tag{position:absolute;top:12px;background:#12232be8;border:1px solid #71858c;padding:5px 12px;border-radius:4px;font-size:12px}.left{left:12px}.right{right:12px}.slider{display:flex;align-items:center;gap:20px;margin:20px 0}.slider input{flex:1;min-width:60px;accent-color:#ecd5a6}.slider label{white-space:nowrap}footer{margin-top:24px;display:flex;gap:25px;flex-wrap:wrap}.fine{font-size:12px;color:#9aafad}@media(max-width:640px){main{padding:26px 14px}.tag{top:5px;padding:2px 5px;font-size:10px}button{padding:7px 13px}.slider{gap:10px}}
</style>
<main>
<div class="eyebrow">HARBOR STORIES / RADIANCE 6.3.1</div>
<h1>让港口恢复明亮与色彩</h1>
<p>拖动滑杆，对照同一机位、同一批模型的实际游戏截图。本轮降低天空泛白，改善物体补光与色彩，保留阴影和水面反射。两个版本均使用精细画质、曝光 1，截图时间已冻结。</p>
<nav aria-label="对照场景">
<button data-scene="boat" aria-pressed="true">快艇与水面</button><button data-scene="sport" aria-pressed="false">跑车</button><button data-scene="quay" aria-pressed="false">集装箱</button><button data-scene="warehouse" aria-pressed="false">仓库</button><button data-scene="rifle" aria-pressed="false">武器</button><button data-scene="harbor" aria-pressed="false">港区全景</button>
</nav>
<div class="compare" id="compare">
<img id="after" src="previews/graphics-after-boat.png" width="1440" height="900" alt="6.3.1 调整后的快艇场景">
<img id="before" class="old" src="previews/grading-before-boat.png" width="1440" height="900" alt="6.3 调整前的快艇场景">
<span class="line" id="line"></span><span class="tag left">6.3 · 调整前</span><span class="tag right">6.3.1 · 调整后</span>
</div>
<div class="slider"><label for="split">对照位置</label><input id="split" type="range" min="0" max="100" value="50" aria-label="左右移动查看升级前后的画面"><output id="split-value" for="split">50%</output></div>
<p id="caption" aria-live="polite">水面恢复蓝绿色，保留快艇与码头反射；远处雾气更克制。</p>
<p class="fine">这是游戏版本对照，并非 Blender Cycles 渲染。角色和部分建筑仍是风格化模型；实时光照与离线光线追踪存在差异。</p>
<footer><a href="index.html?v=6.4.0">进入游戏 · 可切换 6.2 / 6.3.1 →</a><a href="showroom.html">查看 AR-7 独立展示</a><a href="GRAPHICS_ZH.md">实现与验证说明</a></footer>
</main>
<script>
const descriptions={boat:'水面恢复蓝绿色，保留快艇与码头反射；远处雾气更克制。',sport:'车漆恢复暖色和亮度，轮胎与底盘仍有清晰阴影。',quay:'集装箱底部接触更清晰，金属表面随环境和观察方向改变。',warehouse:'环境补光降低了阴影中的蓝色偏色，仓库仍保留明暗层次。',rifle:'武器沿用 Blender 材质参数，增加环境反射和近景阴影；角色保留现有造型。',harbor:'三张地图共用新的光照与色彩流程，保留区域阳光差异。'};
const before=document.querySelector('#before'),after=document.querySelector('#after'),line=document.querySelector('#line');
document.querySelector('#split').addEventListener('input',e=>{const value=Number(e.target.value);before.style.clipPath=`inset(0 ${100-value}% 0 0)`;line.style.left=value+'%';document.querySelector('#split-value').value=value+'%';});
document.querySelectorAll('[data-scene]').forEach(button=>button.addEventListener('click',()=>{const scene=button.dataset.scene;before.src=`previews/grading-before-${scene}.png`;after.src=`previews/graphics-after-${scene}.png`;before.alt='6.3 调整前：'+button.textContent;after.alt='6.3.1 调整后：'+button.textContent;document.querySelector('#caption').textContent=descriptions[scene];document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
</script>
</html>
