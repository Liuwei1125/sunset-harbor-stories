<script>
'use strict';
const B=BABYLON, $=s=>document.querySelector(s), canvas=$('#view');
const engine=new B.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});
function resizeRenderer(){
 // Babylon divides the CSS dimensions by this value. Use the inverse DPR;
 // cap at 2x so high-density phones do not render an unnecessarily large frame.
 engine.setHardwareScalingLevel(1/Math.min(2,Math.max(1,window.devicePixelRatio||1)));
}
let densityQuery;
function trackDisplayDensity(){
 if(densityQuery)densityQuery.removeEventListener('change',trackDisplayDensity);
 resizeRenderer();
 densityQuery=matchMedia(`(resolution: ${window.devicePixelRatio||1}dppx)`);
 densityQuery.addEventListener('change',trackDisplayDensity,{once:true});
}
trackDisplayDensity();
const scene=new B.Scene(engine);scene.useRightHandedSystem=true;scene.clearColor=new B.Color4(.88,.9,.88,1);
scene.imageProcessingConfiguration.toneMappingEnabled=true;scene.imageProcessingConfiguration.toneMappingType=B.ImageProcessingConfiguration.TONEMAPPING_ACES;scene.imageProcessingConfiguration.exposure=1.05;
const env=new B.HDRCubeTexture('../../../assets/showroom/studio.hdr',scene,256,false,true,false,true);scene.environmentTexture=env;scene.environmentIntensity=.60;scene.fogMode=B.Scene.FOGMODE_LINEAR;scene.fogStart=12;scene.fogEnd=40;scene.fogColor=new B.Color3(.88,.90,.88);
const orbit=new B.ArcRotateCamera('orbit',-2.32,1.22,8.1,new B.Vector3(0,.68,0),scene);orbit.minZ=.03;orbit.lowerRadiusLimit=3;orbit.upperRadiusLimit=24;orbit.lowerBetaLimit=.18;orbit.upperBetaLimit=1.51;orbit.wheelDeltaPercentage=.012;orbit.panningSensibility=0;orbit.attachControl(canvas,true);
const cockpit=new B.UniversalCamera('cockpit',new B.Vector3(-.38,1.125,.46),scene);cockpit.minZ=.015;cockpit.fov=1.30;cockpit.setTarget(new B.Vector3(-.04,.83,-.78));cockpit.inputs.clear();
scene.activeCamera=orbit;
const sun=new B.DirectionalLight('softbox',new B.Vector3(.5,-1,.4),scene);sun.position=new B.Vector3(-4,8,-4);sun.intensity=1.35;
const fill=new B.HemisphericLight('fill',new B.Vector3(0,1,0),scene);fill.intensity=.22;fill.groundColor=new B.Color3(.37,.41,.40);
const shadow=new B.ShadowGenerator(2048,sun);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=24;shadow.setDarkness(.22);shadow.normalBias=.003;
const floor=B.MeshBuilder.CreateGround('floor',{width:200,height:200},scene);floor.position.y=-.013;floor.receiveShadows=true;
const floorMat=new B.PBRMaterial('warm neutral',scene);floorMat.albedoColor=B.Color3.FromHexString('#BEC7C5').toLinearSpace();floorMat.roughness=.82;floorMat.metallic=0;floor.material=floorMat;
const pipeline=new B.DefaultRenderingPipeline('finish',true,scene,[orbit,cockpit]);
pipeline.samples=Math.min(4,engine.getCaps().maxMSAASamples||1);
// Preserve fine trim and wheel spokes; only use FXAA when MSAA is unavailable.
pipeline.fxaaEnabled=pipeline.samples===1;
function framingRadius(){return Math.max(7.4,6.2/(canvas.clientWidth/canvas.clientHeight));}
let container=null,joints=[],paints=[],rot=0,turn=0,loading=false,current='front',color='#007BC8',frameRadius=framingRadius();
function paint(){paints.forEach(m=>m.albedoColor=B.Color3.FromHexString(color).toLinearSpace());}
async function load(lod='high'){
 if(loading)return;loading=true;$('#load').style.display='grid';$('#load').classList.remove('error');$('#load').textContent='正在打开 SU7 模型…';$('#lightweight').disabled=true;
 try{
  const next=await B.SceneLoader.LoadAssetContainerAsync('./','xiaomi-su7.'+lod+'.glb?v=0.6',scene);
  if(container){container.meshes.forEach(m=>shadow.removeShadowCaster(m));container.dispose();}
  container=next;container.addAllToScene();
  // The source uses millimetre-thick tinted glazing. Supply its absorption
  // distance explicitly for the real-time renderer's refraction model.
  container.materials.filter(m=>/^(14 |15 |22 )/.test(m.name)).forEach(m=>{
   m.subSurface.tintColor=m.albedoColor.clone();m.subSurface.tintColorAtDistance=.0032;
   m.subSurface.minimumThickness=.0032;m.subSurface.maximumThickness=.0032;
  });
  joints=container.transformNodes.filter(n=>n.name.startsWith('joint:'));paints=container.materials.filter(m=>m.name.startsWith('01 '));paint();
  container.meshes.forEach(m=>{if(m.geometry){m.applyFog=false;m.receiveShadows=true;shadow.addShadowCaster(m);}});
  const triangles=container.meshes.reduce((n,m)=>n+(m.getTotalIndices?.()||0)/3,0);
  $('#stats').textContent=Math.round(triangles/1000)+'k 面';window.__su7.ready=true;window.__su7.lod=lod;window.__su7.triangles=triangles;$('#load').style.display='none';
 }catch(e){$('#load').classList.add('error');$('#load').textContent='模型打开失败：'+e.message;window.__su7.error=e.message;console.error(e);}
 finally{loading=false;$('#lightweight').disabled=false;}
}
function view(name){
 current=name;document.body.classList.toggle('cockpit',name==='cockpit');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===name));
 if(name==='cockpit'){scene.activeCamera=cockpit;$('#rotate').checked=false;}
 else{scene.activeCamera=orbit;orbit.setTarget(new B.Vector3(0,.68,0));frameRadius=framingRadius();orbit.radius=frameRadius;const poses={front:[-2.26,1.37],side:[-Math.PI,1.48],rear:[.80,1.25]};[orbit.alpha,orbit.beta]=poses[name];}
 window.__su7.view=name;
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;paint();document.querySelectorAll('[data-color]').forEach(c=>c.classList.toggle('on',c===b));});
$('#lightweight').onchange=()=>load($('#lightweight').checked?'low':'high');
$('#steer').oninput=()=>turn=Number($('#steer').value)*Math.PI/180;
$('#rotate').onchange=()=>{if(current==='cockpit'&&$('#rotate').checked)view('front');};
window.__su7={version:'0.6',ready:false,scene,engine,view:'front',lod:'high',error:null,joints:()=>joints.map(n=>n.name),pose:()=>joints.map(n=>({name:n.name,q:n.rotationQuaternion?.asArray()}))};
engine.runRenderLoop(()=>{
 const dt=Math.min(.05,engine.getDeltaTime()/1000);
 if($('#rotate').checked&&scene.activeCamera===orbit)orbit.alpha+=dt*.14;
 if($('#wheels').checked)rot-=dt*2.5;
 for(const j of joints){const name=j.name.slice(6);if(name.startsWith('wheel-'))j.rotationQuaternion=B.Quaternion.RotationAxis(B.Axis.Y,name.includes('front')?turn:0).multiply(B.Quaternion.RotationAxis(B.Axis.X,rot));if(name==='steering')j.rotationQuaternion=B.Quaternion.RotationAxis(B.Axis.Z,-turn*2.4);}
 scene.render();
});
addEventListener('resize',()=>{
 resizeRenderer();
 // Preserve the user's zoom while fitting the new window or phone orientation.
 const nextRadius=framingRadius();
 orbit.radius=B.Scalar.Clamp(orbit.radius*nextRadius/frameRadius,orbit.lowerRadiusLimit,orbit.upperRadiusLimit);
 frameRadius=nextRadius;
});load();view('front');
